name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + migration smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        # PySide6 is optional at runtime (AuthND reports missing_dependency); CI skips the Qt wheels.
        run: |
          grep -v '^PySide6' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt pytest pytest-timeout
      - name: Backend tests (mocked AuthND, no browser, no Neo4j)
        env:
          AUTHND_TOKEN_MODE: pool
          AUTHND_TOKEN_POOL_URL: http://127.0.0.1:9/never
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q -p no:warnings --timeout 180
      - name: Migration smoke test (fresh DB -> head, no drift)
        env:
          NOVELFORGE_DB_PATH: /tmp/ci_smoke.db
        run: |
          python - <<'EOF'
          from app.db.session import engine
          from app.db.migrations import upgrade_database, check_schema_drift, head_revision, current_revision
          info = upgrade_database(engine)
          assert current_revision(engine) == head_revision(), info
          drift = check_schema_drift(engine)
          assert not drift, f"Model/DB drift without a revision: {drift}"
          print("migration smoke ok", info)
          EOF
      - name: Export OpenAPI for type consistency check
        run: python scripts/export_openapi.py openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json

  frontend:
    name: Frontend typecheck + tests + build + generated types
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: backend
      - name: Generated API types are up to date
        run: |
          npm run gen:types:file
          git diff --exit-code -- src/renderer/src/types/generated.d.ts || (echo "::error::src/renderer/src/types/generated.d.ts is stale; run 'npm run gen:types:file' after exporting backend/openapi.json" && exit 1)
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production web build
        run: npm run build:web
